name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Isolate the supported SDK from newer runner platforms
        run: |
          mkdir -p "$RUNNER_TEMP/psf-sdk"
          cp -R "$ANDROID_HOME/licenses" "$RUNNER_TEMP/psf-sdk/licenses"
          sdkmanager --sdk_root="$RUNNER_TEMP/psf-sdk" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$RUNNER_TEMP/psf-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/psf-sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/graph.test.cjs tools/navigation.test.cjs tools/numbered.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
