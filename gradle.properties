org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# JAVA_HOME is not set machine-wide; pin the JDK that ships the Android tooling.
org.gradle.java.home=C:\\Android\\tools\\jdk-17.0.2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.5.2 was tested up to compileSdk 34; we build against 36 to meet
# Google Play's target API level requirement for new apps.
android.suppressUnsupportedCompileSdk=36
android.overridePathCheck=true

kotlin.code.style=official
